name: Publish Comtainer Image

on:
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Push Container Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Update Version Info
        run: |
          export REPLACED_REF=$(echo $GITHUB_REF | sed -r 's/\//\\\//g')
          export NONPREFIXED_VERSION="${GITHUB_REF_NAME:1}"

          # Update embedded build info
          sed -rie "s/^\s+Version:(.*)$/\tVersion: \"$NONPREFIXED_VERSION\",/m" ./cmd/version.go
          sed -rie "s/^\s+Revision:(.*)$/\\tRevision: \"$GITHUB_SHA\",/m" ./cmd/version.go
          sed -rie "s/^\s+Reference:(.*)$/\\tReference: \"$REPLACED_REF\",/m" ./cmd/version.go
          sed -rie "s/^\s+BuiltAt:(.*)$/\\tBuiltAt: \"$(date --iso-8601=seconds)\",/m" ./cmd/version.go
          gofmt -w ./cmd/version.go
          cat ./cmd/version.go

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
